models:
  - hf_repo_id: "BAAI/bge-m3"
    handler: "app.models.hf_embedding.HFEmbeddingModel"
    supports_structured_outputs: false
  - hf_repo_id: "google/embeddinggemma-300m"
    handler: "app.models.hf_embedding.HFEmbeddingModel"
    supports_structured_outputs: false
  - hf_repo_id: "Qwen/Qwen3-Embedding-0.6B"
    handler: "app.models.hf_embedding.HFEmbeddingModel"
    supports_structured_outputs: false
    pooling: "last_token"
  - hf_repo_id: "Qwen/Qwen3-Embedding-4B"
    handler: "app.models.hf_embedding.HFEmbeddingModel"
    supports_structured_outputs: false
    pooling: "last_token"
  - hf_repo_id: "Qwen/Qwen3-VL-4B-Instruct-FP8"
    handler: "app.models.qwen_vl.QwenVLChat"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 512
  - hf_repo_id: "Qwen/Qwen3-VL-2B-Instruct-FP8"
    handler: "app.models.qwen_vl.QwenVLChat"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 512
  - hf_repo_id: "Qwen/Qwen3-VL-4B-Instruct"
    handler: "app.models.qwen_vl.QwenVLChat"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 512
  - hf_repo_id: "Qwen/Qwen3-VL-2B-Instruct"
    handler: "app.models.qwen_vl.QwenVLChat"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 512
  - hf_repo_id: "LiquidAI/LFM2-1.2B"
    handler: "app.models.text_chat.TextChatModel"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 512
  - hf_repo_id: "Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled"
    name: "qwen3.5:27b-distilled"
    handler: "app.models.text_chat.TextChatModel"
    supports_structured_outputs: true
    defaults:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      repetition_penalty: 1.1
      seed: 3407
      max_tokens: 8192
  - hf_repo_id: "nvidia/Gemma-4-31B-IT-NVFP4"
    name: "gemma4:31b-nvfp4"
    handler: "app.models.text_chat.TextChatModel"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 8192
  - hf_repo_id: "kai-os/gemma4-31b-Opus-4.6-reasoning"
    name: "gemma4:31b-opus-reasoning"
    handler: "app.models.text_chat.TextChatModel"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 8192
  - hf_repo_id: "caiovicentino1/Huihui-Qwopus3.5-27B-v3-abliterated-PolarQuant-Q5"
    name: "qwopus3.5:27b-abliterated-q5"
    handler: "app.models.text_chat.TextChatModel"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 4096
  - hf_repo_id: "openai/gpt-oss-20b"
    handler: "app.models.text_chat.TextChatModel"
    supports_structured_outputs: true
    defaults:
      temperature: 0.7
      top_p: 0.9
      max_tokens: 8192
  # TTS models (requires chatterbox-tts package)
